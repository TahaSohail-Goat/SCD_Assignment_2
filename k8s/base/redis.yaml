apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      serviceAccountName: rahbar-data
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:7.4.2-alpine
          command: [redis-server, --appendonly, "yes", --dir, /data]
          ports:
            - {name: redis, containerPort: 6379}
          volumeMounts:
            - {name: redis-data, mountPath: /data}
          startupProbe:
            tcpSocket: {port: redis}
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 20
          readinessProbe:
            tcpSocket: {port: redis}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes:
        - name: redis-data
          persistentVolumeClaim: {claimName: redis-data}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ClusterIP
  selector: {app: redis}
  ports:
    - {name: redis, port: 6379, targetPort: redis}
