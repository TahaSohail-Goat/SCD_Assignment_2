name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/requirements-dev.txt
            indexer/requirements-dev.txt
      - run: python -m pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - run: ruff check api indexer eval corpus
      - run: cd api && mypy app
      - run: cd indexer && mypy pipeline
      - run: cd api && pytest -q --cov=app --cov-branch --cov-fail-under=60
      - run: cd indexer && pytest -q
      - run: python scripts/check_submission.py
        continue-on-error: true # the teammate's corpus/evaluation work is still pending
  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: azure/setup-kubectl@v4
        with: {version: v1.33.0}
      - run: kubectl kustomize k8s/overlays/prod | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0-alpine -strict -summary -ignore-missing-schemas
      - run: kubectl kustomize k8s/overlays/dev | docker run --rm -i ghcr.io/yannh/kubeconform:v0.8.0-alpine -strict -summary -ignore-missing-schemas
  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        component: [api, indexer, ui]
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - run: docker build -t rahbar-${{ matrix.component }}:ci ${{ matrix.component }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rahbar-${{ matrix.component }}:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
