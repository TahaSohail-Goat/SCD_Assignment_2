name: CD
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - run: cd api && pytest -q --cov=app --cov-branch --cov-fail-under=60
      - run: cd indexer && pytest -q
      - uses: helm/kind-action@v1.14.0
      - run: |
          for component in api indexer ui; do
            docker build -t "rahbar-$component:dev" "$component"
            kind load docker-image "rahbar-$component:dev"
          done
      - run: kubectl apply -k k8s/overlays/dev
      - run: kubectl wait -n rahbar --for=condition=complete job/initial-index --timeout=600s
      - run: kubectl rollout status -n rahbar deployment/api --timeout=600s
      - name: Smoke API in the ephemeral cluster
        run: |
          kubectl port-forward -n rahbar svc/api 8000:8000 &
          forward_pid=$!
          trap 'kill "$forward_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/readyz; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/healthz
          curl -fsS -X POST http://localhost:8000/api/ask \
            -H 'Content-Type: application/json' \
            -d '{"question":"What is the attendance requirement?"}' \
            | python -c 'import json,sys; x=json.load(sys.stdin); assert x["citations"] and x["answered_from_context"]'
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push immutable tags
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          for component in api indexer ui; do
            docker tag "rahbar-$component:dev" "$HUB_USER/rahbar-$component:sha-${GITHUB_SHA}"
            docker push "$HUB_USER/rahbar-$component:sha-${GITHUB_SHA}"
          done
