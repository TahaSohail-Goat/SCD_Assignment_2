name: CD
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
      - run: ruff check api indexer eval corpus scripts
      - run: cd api && pytest -q --cov=app --cov-branch --cov-fail-under=60
      - run: cd indexer && pytest -q
      - run: python -m pytest -q -c eval/pyproject.toml eval/tests
  build-push:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push immutable SHA tags
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          for component in api indexer ui; do
            docker build --build-arg VCS_REF="$COMMIT_SHA" \
              -t "$HUB_USER/rahbar-$component:sha-${COMMIT_SHA}" "$component"
            docker push "$HUB_USER/rahbar-$component:sha-${COMMIT_SHA}"
          done
      - name: Record published image links for the team hand-in
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          user, sha = os.environ["HUB_USER"], os.environ["COMMIT_SHA"]
          record = {"commit": sha, "images": {component: {
              "image": f"{user}/rahbar-{component}:sha-{sha}",
              "docker_hub": f"https://hub.docker.com/r/{user}/rahbar-{component}/tags?name=sha-{sha}",
          } for component in ("api", "indexer", "ui")}}
          Path("release-image-links.json").write_text(json.dumps(record, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-image-links
          path: release-image-links.json
  deploy:
    needs: build-push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: {persist-credentials: false}
      - uses: helm/kind-action@v1.14.0
      - name: Install Ingress controller
        run: bash scripts/install_ingress.sh
      - name: Load exact published images into ephemeral cluster
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          for component in api indexer ui; do
            image="$HUB_USER/rahbar-$component:sha-${COMMIT_SHA}"
            docker pull "$image"
            kind load docker-image --name chart-testing "$image"
            sed -i "s|rahbar-$component:dev|$image|g" k8s/base/$component.yaml
          done
          sed -i "s|rahbar-indexer:dev|$HUB_USER/rahbar-indexer:sha-${COMMIT_SHA}|g" k8s/base/indexer.yaml
      - run: kubectl apply -k k8s/overlays/dev
      - run: kubectl wait -n rahbar --for=condition=complete job/initial-index --timeout=600s
      - run: kubectl rollout status -n rahbar deployment/api --timeout=600s
      - name: Smoke through the Ingress
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: bash scripts/smoke_ingress.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cd-ingress-smoke
          path: output/ingress-smoke/
