# Labels were written before observing embedding similarities.
# Equivalent=True means the cached answer and its policy qualifications may be reused.
cases:
  - id: cgpa-paraphrase
    first: What minimum CGPA avoids academic warning in an undergraduate programme?
    second: What is the undergraduate CGPA threshold for avoiding academic warning?
    equivalent: true
  - id: summer-paraphrase
    first: Under the current undergraduate rules, how long is the summer semester?
    second: How many weeks does the current undergraduate summer semester last?
    equivalent: true
  - id: teaching-paraphrase
    first: What is the duration in minutes of one classroom teaching period?
    second: How many minutes is a classroom teaching period under the undergraduate rules?
    equivalent: true
  - id: grade-paraphrase
    first: Which interpretation corresponds to grades A and A-?
    second: How does the letter-grade table interpret A and A-?
    equivalent: true
  - id: regular-vs-summer-attendance
    first: What attendance percentage is required in a regular undergraduate course?
    second: What attendance percentage is required in a summer undergraduate course?
    equivalent: false
  - id: attendance-vs-absence
    first: What attendance percentage is required in an undergraduate course?
    second: What maximum absence percentage can the head of department condone?
    equivalent: false
  - id: minimum-vs-maximum-degree
    first: What is the minimum duration of a Bachelor's degree?
    second: What is the maximum duration of a Bachelor's degree?
    equivalent: false
  - id: warning-vs-closure
    first: What happens after one semester below CGPA 2.00?
    second: What happens after three consecutive semesters below CGPA 2.00?
    equivalent: false
  - id: current-vs-previous-summer
    first: Under the current undergraduate rules, how long is the summer semester?
    second: Under the August 2023 undergraduate rules, how long was the summer semester?
    equivalent: false
  - id: duration-vs-credit-hours
    first: What is the duration of a classroom teaching period?
    second: What is the credit-hour assignment of a classroom course?
    equivalent: false
